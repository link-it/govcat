      summary: Retrieve a Purpose
      tags:
      - gateway
      parameters:
      - description: The ID of the Purpose to retrieve
        in: path
        name: purposeId
        required: true
        schema:
          $ref: '#/components/schemas/PurposeId'
  /purposes/{purposeId}/agreement:
    get:
