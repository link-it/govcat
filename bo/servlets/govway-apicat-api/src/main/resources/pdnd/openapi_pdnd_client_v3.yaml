components:
  headers:
    IntegrityRest02AgidJwtSignatureHeader:
      description: 'The `Agid-JWT-Signature` header contains a JSON Web Signature (JWS) signed with the
        PDND API private key.

        It ensures payload integrity and non-repudiation across all responses (both success and error),
        in compliance with: 1) Linee Guida sull''interoperabilità tecnica delle Pubbliche Amministrazioni
        - Pattern di sicurezza,  2) RFC 7515 and 3) RFC 7519.

        '
      schema:
        type: string
    IntegrityRest02DigestHeader:
      description: 'Digest of the body using the canonical JSON representation of the response body.

        The digest is calculated using the SHA-256 algorithm on the response body

        exactly as it is sent to the client, encoded in Base64 as per RFC 3230

        '
      schema:
        pattern: ^SHA-256=[a-zA-Z0-9+/]{43}=$
        type: string
    RateLimitIntervalHeader:
      description: Time interval in milliseconds. Allowed requests will be constantly replenished during
        the interval. At the end of the interval the max allowed requests will be available
      schema:
        format: int32
        minimum: 0
        type: integer
    RateLimitLimitHeader:
      description: Max allowed requests within time interval
      schema:
        format: int32
        minimum: 0
        type: integer
    RateLimitRemainingHeader:
      description: Remaining requests within time interval
      schema:
        format: int32
        minimum: 0
        type: integer
  parameters:
    EserviceIdsParam:
      description: Filter by E-Service IDs. If not specified, return results for any E-Service. For e-services
        that are instances of an e-service template, purpose templates linked to the originating e-service
        template are also returned.
      explode: false
      in: query
      name: eserviceIds
      required: false
      schema:
        default: []
        items:
          format: uuid
          type: string
        type: array
    EventsDelegationId:
      description: "Filter events by delegation ID.\n- Omitted: Return all events, both for delegated\
        \ and non-delegated resources.\n- Delegation UUID: Return only events for resources related to\
        \ the specified delegation.\n- null: Return only events for resources accessible without delegation\n\
        \    (public resources, resources accessible as consumer/producer, owned resources, etc.)\n"
      in: query
      name: delegationId
      required: false
      schema:
        format: uuid
        nullable: true
        type: string
    EventsLimit:
      description: Maximum number of events to return.
      in: query
      name: limit
      required: true
      schema:
        format: int32
        maximum: 500
        minimum: 1
        type: integer
    LastEventId:
      description: 'ID of the last event already received.

        Only events that occurred after this ID will be returned.

        If not provided, the oldest events up to the specified limit will be returned.

        '
      in: query
      name: lastEventId
      schema:
        format: uuid
        type: string
    LimitParam:
      description: Maximum number of results to return
      in: query
      name: limit
      required: true
      schema:
        format: int32
        maximum: 50
        minimum: 1
        type: integer
    OffsetParam:
      description: Pagination starting position
      in: query
      name: offset
      required: true
      schema:
        format: int32
        minimum: 0
        type: integer
    TemplateIdsParam:
      description: Filter E-Services by template IDs. If not specified, return E-Services for any template,
        and E-Services without a template
      explode: false
      in: query
      name: templateIds
      required: false
      schema:
        default: []
        items:
          format: uuid
          type: string
        type: array
  responses:
    BadRequest:
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
      description: Bad Request
      headers:
        Agid-JWT-Signature:
          $ref: '#/components/headers/IntegrityRest02AgidJwtSignatureHeader'
        Digest:
          $ref: '#/components/headers/IntegrityRest02DigestHeader'
        X-Rate-Limit-Interval:
          $ref: '#/components/headers/RateLimitIntervalHeader'
        X-Rate-Limit-Limit:
          $ref: '#/components/headers/RateLimitLimitHeader'
        X-Rate-Limit-Remaining:
          $ref: '#/components/headers/RateLimitRemainingHeader'
    Conflict:
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
      description: Conflict
      headers:
        Agid-JWT-Signature:
          $ref: '#/components/headers/IntegrityRest02AgidJwtSignatureHeader'
        Digest:
          $ref: '#/components/headers/IntegrityRest02DigestHeader'
        X-Rate-Limit-Interval:
          $ref: '#/components/headers/RateLimitIntervalHeader'
        X-Rate-Limit-Limit:
          $ref: '#/components/headers/RateLimitLimitHeader'
        X-Rate-Limit-Remaining:
          $ref: '#/components/headers/RateLimitRemainingHeader'
    Forbidden:
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
      description: Forbidden
      headers:
        Agid-JWT-Signature:
          $ref: '#/components/headers/IntegrityRest02AgidJwtSignatureHeader'
        Digest:
          $ref: '#/components/headers/IntegrityRest02DigestHeader'
        X-Rate-Limit-Interval:
          $ref: '#/components/headers/RateLimitIntervalHeader'
        X-Rate-Limit-Limit:
          $ref: '#/components/headers/RateLimitLimitHeader'
        X-Rate-Limit-Remaining:
          $ref: '#/components/headers/RateLimitRemainingHeader'
    NotFound:
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
      description: Not Found
      headers:
        Agid-JWT-Signature:
          $ref: '#/components/headers/IntegrityRest02AgidJwtSignatureHeader'
        Digest:
          $ref: '#/components/headers/IntegrityRest02DigestHeader'
        X-Rate-Limit-Interval:
          $ref: '#/components/headers/RateLimitIntervalHeader'
        X-Rate-Limit-Limit:
          $ref: '#/components/headers/RateLimitLimitHeader'
        X-Rate-Limit-Remaining:
          $ref: '#/components/headers/RateLimitRemainingHeader'
    TooManyRequests:
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
      description: Too Many Requests
      headers:
        Agid-JWT-Signature:
          $ref: '#/components/headers/IntegrityRest02AgidJwtSignatureHeader'
        Digest:
          $ref: '#/components/headers/IntegrityRest02DigestHeader'
        X-Rate-Limit-Interval:
          $ref: '#/components/headers/RateLimitIntervalHeader'
        X-Rate-Limit-Limit:
          $ref: '#/components/headers/RateLimitLimitHeader'
        X-Rate-Limit-Remaining:
          $ref: '#/components/headers/RateLimitRemainingHeader'
    Unauthorized:
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
      description: Unauthorized
      headers:
        Agid-JWT-Signature:
          $ref: '#/components/headers/IntegrityRest02AgidJwtSignatureHeader'
        Digest:
          $ref: '#/components/headers/IntegrityRest02DigestHeader'
        X-Rate-Limit-Interval:
          $ref: '#/components/headers/RateLimitIntervalHeader'
        X-Rate-Limit-Limit:
          $ref: '#/components/headers/RateLimitLimitHeader'
        X-Rate-Limit-Remaining:
          $ref: '#/components/headers/RateLimitRemainingHeader'
  schemas:
    Agreement:
      additionalProperties: false
      properties:
        consumerId:
          format: uuid
          type: string
        consumerNotes:
          type: string
        createdAt:
          format: date-time
          type: string
        delegationId:
          $ref: '#/components/schemas/DelegationId'
        descriptorId:
          $ref: '#/components/schemas/DescriptorId'
        eserviceId:
          $ref: '#/components/schemas/EServiceId'
        id:
          format: uuid
          type: string
        producerId:
          format: uuid
          type: string
        rejectionReason:
          type: string
        state:
          $ref: '#/components/schemas/AgreementState'
        suspendedAt:
          format: date-time
          type: string
        suspendedByConsumer:
          type: boolean
        suspendedByPlatform:
          type: boolean
        suspendedByProducer:
          type: boolean
        updatedAt:
          format: date-time
          type: string
      required:
      - id
      - eserviceId
      - descriptorId
      - producerId
      - consumerId
      - state
      - createdAt
      type: object
    AgreementApprovalPolicy:
      description: E-Service Descriptor policy for new Agreements approval
      enum:
      - AUTOMATIC
      - MANUAL
      type: string
    AgreementEvent:
      additionalProperties: false
      properties:
        agreementId:
          $ref: '#/components/schemas/AgreementId'
        consumerDelegationId:
          format: uuid
          type: string
        eventTimestamp:
          format: date-time
          type: string
        eventType:
          enum:
          - AGREEMENT_ADDED
          - DRAFT_AGREEMENT_UPDATED
          - AGREEMENT_DELETED
          - AGREEMENT_ACTIVATED
          - AGREEMENT_REJECTED
          - AGREEMENT_UPGRADED
          - AGREEMENT_SUBMITTED
          - AGREEMENT_ARCHIVED_BY_CONSUMER
          - AGREEMENT_SUSPENDED_BY_CONSUMER
          - AGREEMENT_UNSUSPENDED_BY_CONSUMER
          - AGREEMENT_SUSPENDED_BY_PRODUCER
          - AGREEMENT_UNSUSPENDED_BY_PRODUCER
          - AGREEMENT_SUSPENDED_BY_PLATFORM
          - AGREEMENT_UNSUSPENDED_BY_PLATFORM
          - AGREEMENT_ARCHIVED_BY_UPGRADE
          - AGREEMENT_CONSUMER_DOCUMENT_ADDED
          - AGREEMENT_CONSUMER_DOCUMENT_REMOVED
          - AGREEMENT_ARCHIVED_BY_REVOKED_DELEGATION
          - AGREEMENT_DELETED_BY_REVOKED_DELEGATION
          - AGREEMENT_SET_MISSING_CERTIFIED_ATTRIBUTES_BY_PLATFORM
          - AGREEMENT_SET_DRAFT_BY_PLATFORM
          - AGREEMENT_CONTRACT_GENERATED
          type: string
        id:
          format: uuid
          type: string
        producerDelegationId:
          format: uuid
          type: string
      required:
      - id
      - eventType
      - eventTimestamp
      - agreementId
      type: object
    AgreementEvents:
      additionalProperties: false
      properties:
        events:
          items:
            $ref: '#/components/schemas/AgreementEvent'
          type: array
      required:
      - events
      type: object
    AgreementId:
      description: The unique identifier of the Agreement
      format: uuid
      type: string
    AgreementState:
      description: Agreement State
      enum:
      - DRAFT
      - ACTIVE
      - ARCHIVED
      - PENDING
      - SUSPENDED
      - MISSING_CERTIFIED_ATTRIBUTES
      - REJECTED
      type: string
    Agreements:
      additionalProperties: false
      properties:
        pagination:
          $ref: '#/components/schemas/Pagination'
        results:
          items:
            $ref: '#/components/schemas/Agreement'
          type: array
      required:
      - results
      - pagination
      type: object
    ArchivingSchedule:
      additionalProperties: false
      properties:
        archivableOn:
          format: date-time
          type: string
        gracePeriodDays:
          $ref: '#/components/schemas/GracePeriodDays'
        scope:
          $ref: '#/components/schemas/ArchivingScope'
        startedAt:
          format: date-time
          type: string
      required:
      - archivableOn
      - startedAt
      - scope
      - gracePeriodDays
      type: object
    ArchivingScope:
      description: Archiving Scope
      enum:
      - ESERVICE
      - DESCRIPTOR
      type: string
    AsyncExchangeProperties:
      properties:
        bulk:
          type: boolean
        confirmation:
          type: boolean
        maxResultSet:
          format: int32
          maximum: 99999
          minimum: 1
          type: integer
        resourceAvailableTime:
          format: int32
          maximum: 999999
          minimum: 1
          type: integer
        responseTime:
          format: int32
          maximum: 999999
          minimum: 1
          type: integer
      required:
      - responseTime
      - resourceAvailableTime
      - confirmation
      - bulk
      - maxResultSet
      type: object
    AttributeEvent:
      additionalProperties: false
      properties:
        attributeId:
          $ref: '#/components/schemas/AttributeId'
        eventTimestamp:
          format: date-time
          type: string
        eventType:
          enum:
          - ATTRIBUTE_ADDED
          type: string
        id:
          format: uuid
          type: string
      required:
      - id
      - eventType
      - eventTimestamp
      - attributeId
      type: object
    AttributeEvents:
      additionalProperties: false
      properties:
