# NOTA: file generato dalla specifica ufficiale PDND core v3
# (pagopa/interop-be-monorepo -> packages/api-clients/open-api/m2mGatewayApiV3.yml)
# tramite lo script documentato in ChangeLog; contiene le sole operazioni usate da GovCat.
openapi: 3.0.3
info:
  contact:
    name: API Support
    url: https://github.com/pagopa/pdnd-interop-frontend/issues
  description: 'Sottoinsieme della specifica ufficiale PDND core v3 (m2mGatewayApiV3) contenente le sole
    operazioni invocate da GovCat. L''autenticazione verso la PDND (voucher e DPoP) e'' delegata al gateway
    GovWay: la specifica non dichiara quindi alcuno schema di sicurezza.'
  termsOfService: https://selfcare.interop.pagopa.it/ui/it/termini-di-servizio
  title: PDND Interoperability API (v3) - operazioni utilizzate da GovCat
  version: 3.1.0
  x-summary: PDND Interoperability API
servers:
- url: /v3
  description: PDND core v3
tags:
- name: gateway
  description: Operazioni PDND v3 utilizzate da GovCat
paths:
  /status:
    get:
      description: Retrieve the status of the API
      operationId: getStatus
      responses:
        '200':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: Status retrieved
          headers:
            Agid-JWT-Signature:
              $ref: '#/components/headers/IntegrityRest02AgidJwtSignatureHeader'
            Digest:
              $ref: '#/components/headers/IntegrityRest02DigestHeader'
            X-Rate-Limit-Interval:
              $ref: '#/components/headers/RateLimitIntervalHeader'
            X-Rate-Limit-Limit:
              $ref: '#/components/headers/RateLimitLimitHeader'
            X-Rate-Limit-Remaining:
              $ref: '#/components/headers/RateLimitRemainingHeader'
        '429':
          $ref: '#/components/responses/TooManyRequests'
      summary: Retrieve the status of the API
      tags:
      - gateway
  /agreements:
    get:
      description: Retrieve a list of Agreements based on filters
      operationId: getAgreements
      parameters:
      - description: Filter Agreements by states. If not specified, return Agreements in any state
        explode: false
        in: query
        name: states
        required: false
        schema:
          default: []
          items:
            $ref: '#/components/schemas/AgreementState'
          type: array
      - description: Filter Agreements by producer IDs. If not specified, return Agreements for any producer
        explode: false
        in: query
        name: producerIds
        required: false
        schema:
          default: []
          items:
            format: uuid
            type: string
          type: array
      - description: Filter Agreements by consumer IDs. If not specified, return Agreements for any consumer
        explode: false
        in: query
        name: consumerIds
        required: false
        schema:
          default: []
          items:
            format: uuid
            type: string
          type: array
      - description: Filter Agreements by Descriptor IDs. If not specified, return Agreements for any
          Descriptor
        explode: false
        in: query
        name: descriptorIds
        required: false
        schema:
          default: []
          items:
            $ref: '#/components/schemas/DescriptorId'
          type: array
      - $ref: '#/components/parameters/EserviceIdsParam'
      - $ref: '#/components/parameters/OffsetParam'
      - $ref: '#/components/parameters/LimitParam'
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Agreements'
          description: Agreements retrieved
          headers:
            Agid-JWT-Signature:
              $ref: '#/components/headers/IntegrityRest02AgidJwtSignatureHeader'
            Digest:
              $ref: '#/components/headers/IntegrityRest02DigestHeader'
            X-Rate-Limit-Interval:
              $ref: '#/components/headers/RateLimitIntervalHeader'
            X-Rate-Limit-Limit:
              $ref: '#/components/headers/RateLimitLimitHeader'
            X-Rate-Limit-Remaining:
              $ref: '#/components/headers/RateLimitRemainingHeader'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/TooManyRequests'
      summary: List Agreements
      tags:
      - gateway
  /agreements/{agreementId}:
    get:
      description: Retrieve an Agreement
      operationId: getAgreement
      responses:
