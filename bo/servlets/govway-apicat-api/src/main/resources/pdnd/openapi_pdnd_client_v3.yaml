    AttributeId:
      description: The unique identifier of the Attribute
      format: uuid
      type: string
    CertifiedAttribute:
      additionalProperties: false
      properties:
        code:
          description: The identifier of the attribute on the source registry
          type: string
        createdAt:
          format: date-time
          type: string
        description:
          type: string
        id:
          format: uuid
