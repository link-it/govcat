name: GovCat workflow for BE and FE

on:
  push:
    branches: [ "*" ]
    tags:
      - '*'  # Trigger per tutti i tag
  pull_request:
    branches: [ "main", "v2.2.x", "v2.3.x" ]

permissions:
  contents: write
  id-token: write
  actions: write
  security-events: write

jobs:
  build_BE:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0  # Clona tutta la history Git
      - name: Set timezone to Europe/Rome
        run: sudo timedatectl set-timezone Europe/Rome
      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven
      - name: Check NVD_API_KEY
        run: |
          if [ -z "$NVD_API_KEY" ]; then
            echo "NVD_API_KEY is NOT set!"
          else
            echo "NVD_API_KEY is set. Length: ${#NVD_API_KEY}"
          fi
        env:
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
      - name: Get date for cache key
        id: date
        run: echo "date=$(date +'%Y-%m-%d')" >> $GITHUB_OUTPUT

      #  Cache .dependency-check/data
      - name: Cache OWASP Dependency-Check DB
        id: owasp-cache
        uses: actions/cache@v5
        with:
          path: .dependency-check/data
          key: ${{ runner.os }}-owasp-${{ steps.date.outputs.date }}
          restore-keys: |
            ${{ runner.os }}-owasp-

      - name: Test
        run: |
          set -euo pipefail
          mvn clean test -Dowasp=none
        continue-on-error: ${{ github.ref_type == 'branch' && github.ref_name != 'main' }}

      - name: Show JaCoCo report location and Zip JaCoCo HTML report
        run: |
          ls -lh target/site/jacoco-aggregate/
          file target/site/jacoco-aggregate/jacoco.xml || echo "Report non trovato"
          cd target/site
          zip -r ../jacoco-html-report.zip jacoco-aggregate
          cd ../../
          ls -lh target/
        continue-on-error: ${{ github.ref_type == 'branch' && github.ref_name != 'main' }}

      - name: Archive JaCoCo report
        uses: actions/upload-artifact@v6
        with:
          name: jacoco-report
          path: target/site/jacoco-aggregate

      - name: Copy dependencies
        run: |
          mvn install -DskipTests -Dowasp=none 
          mkdir -p target/dependency
          mvn dependency:copy-dependencies -DoutputDirectory=target/dependency -DskipTests -Dowasp=none
        continue-on-error: ${{ github.ref_type == 'branch' && github.ref_name != 'main' }}

      - name: SonarCloud Scan
        if: ${{ github.event_name == 'push' && (github.ref_name == 'main' || vars.FORCE_SONARQUBE_JOB == 'true') }}
        uses: SonarSource/sonarqube-scan-action@v8
        continue-on-error: ${{ github.ref_type == 'branch' && github.ref_name != 'main' }}
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: >
            -Dsonar.projectKey=link-it_govcat
            -Dsonar.projectName=GovCat
            -Dsonar.organization=link-it
            -Dsonar.coverage.jacoco.xmlReportPaths=target/site/jacoco-aggregate/jacoco.xml
            -Dsonar.sources=bo/clients/govwaymonitor/src/main/java,bo/core/business/src/main/java,bo/core/dao/src/main/java,bo/core/dto/src/main/java,bo/core/orm/src/main/java,bo/core/stampe/src/main/java,bo/servlets/govCatConfigurazioneBatch/src/main/java,bo/servlets/govway-apicat-api/src/main/java,configuratore/src/main/java,web/src/main/java
            -Dsonar.tests=bo/clients/govwaymonitor/src/test/java,bo/core/business/src/test/java,bo/core/dao/src/test/java,bo/servlets/govCatConfigurazioneBatch/src/test/java,bo/servlets/govway-apicat-api/src/test/java,configuratore/src/test/java
            -Dsonar.java.binaries=bo/clients/govwaymonitor/target/classes,bo/core/business/target/classes,bo/core/dao/target/classes,bo/core/dto/target/classes,bo/core/orm/target/classes,bo/core/stampe/target/classes,bo/servlets/govCatConfigurazioneBatch/target/classes,bo/servlets/govway-apicat-api/target/classes,configuratore/target/classes,web/target/classes
            -Dsonar.coverage.exclusions=**/test/**,**/*Test*.java
            -Dsonar.java.source=21
            -Dsonar.java.libraries=target/dependency
            -Dsonar.qualitygate.wait=true

      - name: OWASP
        if: ${{ github.event_name == 'push' && (github.ref_name == 'main' || vars.FORCE_OWASP_JOB == 'true') }}
        run: mvn install -DskipTests -Dspring.profiles.active=test -Duser.timezone=Europe/Rome -DnvdApiKey=$NVD_API_KEY -DdataDirectory=.dependency-check/data -Dowasp.format=ALL -Dowasp.output.dir=./dependency-check-report $NOUPDATE_FLAG
        continue-on-error: ${{ github.ref_type == 'branch' && github.ref_name != 'main' }}
        env:
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
          # Se la cache è esatta (stessa giornata) skippa l'update NVD
          NOUPDATE_FLAG: ${{ steps.owasp-cache.outputs.cache-hit == 'true' && '-DautoUpdate=false' || '' }}

      - name: Archive OWASP dependency check report
        uses: actions/upload-artifact@v6
        with:
          name: dependency-check-report
          path: tools/owasp/report

      - name: License Analysis
        if: ${{ github.event_name == 'push' && (github.ref_name == 'main' || vars.FORCE_LICENSE_JOB == 'true') }}
        run: |
          set -euo pipefail
          echo "Downloading license information..."
          mvn org.codehaus.mojo:license-maven-plugin:2.4.0:aggregate-download-licenses -DexcludeScopes=test,provided,system -DincludeTransitiveDependencies=true
          echo "Analyzing licenses..."
          python3 .github/workflows/scripts/analyze_licenses.py --exceptions .github/workflows/scripts/license-exceptions.json
        continue-on-error: ${{ github.ref_type == 'branch' && github.ref_name != 'main' }}

      - name: Archive licenses analysis results
        uses: actions/upload-artifact@v6
        with:
          name: be-third-party-licenses
          path: third-party-licenses

      - name: Build
        run: |
          set -euo pipefail
          mvn clean package -DskipTests -Dowasp=none

  osv_scan_BE:
    if: ${{ github.event_name == 'push' && (github.ref_name == 'main' || github.ref_type == 'tag' || vars.FORCE_OSV_JOB == 'true') }}
    permissions:
      actions: read
      contents: read
      security-events: write
    uses: "google/osv-scanner-action/.github/workflows/osv-scanner-reusable.yml@v2.3.5"
    with:
      matrix-property: 'be-'
      fail-on-vuln: ${{ github.ref_name == 'main' || github.ref_type == 'tag' }}
      scan-args: |-
        --config=./osv-scanner.toml
        -r
        ./bo
        -r
        ./configuratore
        -r
        ./web
        -r
        ./tools
        --lockfile
        ./pom.xml

  osv_scan_FE:
    if: ${{ github.event_name == 'push' && (github.ref_name == 'main' || github.ref_type == 'tag' || vars.FORCE_OSV_JOB == 'true') }}
    permissions:
      actions: read
      contents: read
      security-events: write
    uses: "google/osv-scanner-action/.github/workflows/osv-scanner-reusable.yml@v2.3.5"
    with:
      matrix-property: 'fe-'
      fail-on-vuln: ${{ github.ref_name == 'main' || github.ref_type == 'tag' }}
      scan-args: |-
        --config=./osv-scanner.toml
        -r
        ./frontend/angular

  build_FE:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0  # Clona tutta la history Git
      - name: Set timezone to Europe/Rome
        run: sudo timedatectl set-timezone Europe/Rome
      - name: Set up Node 22
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          check-latest: true
      - name: Install dependencies
        run: |
          set -euo pipefail
          cd frontend/angular/
          npm install
      - name: OWASP
        if: ${{ github.event_name == 'push' && (github.ref_name == 'main' || vars.FORCE_OWASP_JOB == 'true') }}
        uses: dependency-check/Dependency-Check_Action@main
        continue-on-error: ${{ github.ref_type == 'branch' && github.ref_name != 'main' }}
        env:
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
        with:
          project: ${{ github.repository }}
          path: 'frontend/angular'
          out: 'reports'
          format: 'ALL'
          args: >
            --failOnCVSS 0
            --nodeAuditSkipDevDependencies
            --nodePackageSkipDevDependencies
            --disableOssIndex
            --nvdApiKey ${{ secrets.NVD_API_KEY }}
            --suppression tools/owasp/suppression/image-size.xml
            --suppression tools/owasp/suppression/esbuild.xml
      - name: Upload HTML report artifact
        uses: actions/upload-artifact@v6
        with:
          name: fe-dependency-check-report
          path: reports
      - name: Licenses Analysis
        if: ${{ github.event_name == 'push' && (github.ref_name == 'main' || vars.FORCE_LICENSE_JOB == 'true') }}
        run: |
          set -euo pipefail
          cd frontend/angular/
          echo "Downloading license information..."
          npm config set cache .npm --location=project
          npm ci --production
          echo "Analyzing licenses..."
          python3 ../../.github/workflows/scripts/analyze_npm_licenses.py --exceptions ../../.github/workflows/scripts/npm-license-exceptions.json
        continue-on-error: ${{ github.ref_type == 'branch' && github.ref_name != 'main' }}
      - name: Archive licenses analysis results
        uses: actions/upload-artifact@v6
        with:
          name: fe-third-party-licenses
          path: frontend/angular/third-party-licenses
      - name: Build
        run: |
          set -euo pipefail
          cd frontend/angular/
          npm ci
          npm run build-apicat

  # ── SBOM CycloneDX (BE Maven + FE npm) ────────────────────────────────
  # Esecuzione: su tag, su main e sui branch di rilascio vX.Y.x; forzabile con
  # FORCE_SBOM_JOB, disattivabile del tutto con DISABLE_SBOM_JOB.
  sbom:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    if: >-
      vars.DISABLE_SBOM_JOB != 'true' &&
      github.event_name == 'push' &&
      (github.ref_type == 'tag' || github.ref_name == 'main' ||
       (startsWith(github.ref_name, 'v') && endsWith(github.ref_name, '.x')) ||
       vars.FORCE_SBOM_JOB == 'true')
    continue-on-error: ${{ github.ref_type != 'tag' && github.ref_name != 'main' && !(startsWith(github.ref_name, 'v') && endsWith(github.ref_name, '.x')) }}
    env:
      SBOM_CYCLONEDX_PLUGIN_VERSION: '2.9.1'
      SBOM_CYCLONEDX_NPM_VERSION: '6.0.1'
      SBOM_CYCLONEDX_SCHEMA_VERSION: '1.6'

    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Set up Node 22
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          check-latest: true

      # SBOM aggregato di tutti i moduli Maven (bo, configuratore, web, ...).
      # Le dipendenze npm del frontend non sono visibili a Maven: vedi step successivo.
      - name: Generate BE SBOM (CycloneDX json + xml)
        run: |
          set -euo pipefail
          mkdir -p sbom/cyclonedx
          mvn -B org.cyclonedx:cyclonedx-maven-plugin:${SBOM_CYCLONEDX_PLUGIN_VERSION}:makeAggregateBom \
            -Dowasp=none \
            -DoutputDirectory=sbom/cyclonedx \
            -DoutputName=bom.cdx \
            -DoutputFormat=all \
            -DschemaVersion=${SBOM_CYCLONEDX_SCHEMA_VERSION} \
            -DskipNotDeployed=false \
            -DincludeTestScope=false \
            -DprojectType=application

      # Solo dipendenze di runtime: le devDependencies (toolchain Angular,
      # Karma, ...) non finiscono nel bundle distribuito.
      - name: Generate FE SBOM (CycloneDX json)
        run: |
          set -euo pipefail
          cd frontend/angular/
          npm ci
          npx --yes @cyclonedx/cyclonedx-npm@${SBOM_CYCLONEDX_NPM_VERSION} \
            --omit dev \
            --spec-version ${SBOM_CYCLONEDX_SCHEMA_VERSION} \
            --output-reproducible \
            --output-format JSON \
            --output-file ../../sbom/cyclonedx/bom-fe.cdx.json
          ls -la ../../sbom/cyclonedx/

      - name: Upload SBOM artifact
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: sbom-report
          path: sbom/
          retention-days: 30

  # ── Upload SBOM su Dependency-Track ──────────────────────────────────
  # Carica BE e FE sotto i progetti padre GovCat-Backend e GovCat-Frontend
  # (devono gia' esistere in Dependency-Track, vedi upload-sbom-parent-required.sh).
  # Il nome del progetto figlio e' preso dai metadati dell'SBOM, la versione
  # dal tag o dal branch.
  # Esecuzione: su tag, su main e sui branch vX.Y.x; forzabile con
  # FORCE_DTRACK_UPLOAD_JOB; DISABLE_DTRACK_UPLOAD_JOB ha la precedenza su tutto.
  dependency-track-upload:
    needs: [ sbom ]
    if: >-
      vars.DISABLE_DTRACK_UPLOAD_JOB != 'true' &&
      (github.ref_type == 'tag' || github.ref_name == 'main' ||
       (startsWith(github.ref_name, 'v') && endsWith(github.ref_name, '.x')) ||
       vars.FORCE_DTRACK_UPLOAD_JOB == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    # Il fallimento blocca solo tag, main e branch di rilascio; le esecuzioni
    # forzate su altri branch sono tolleranti.
    continue-on-error: ${{ github.ref_type != 'tag' && github.ref_name != 'main' && !(startsWith(github.ref_name, 'v') && endsWith(github.ref_name, '.x')) }}

    steps:
      - uses: actions/checkout@v5

      - name: Download SBOM
        uses: actions/download-artifact@v6
        with:
          name: sbom-report
          path: sbom/

      - name: Verifica prerequisiti
        env:
          DTRACK_API_KEY: ${{ secrets.GOVCAT_DTRACK_API_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${DTRACK_API_KEY}" ]; then
            echo "ERRORE: secret GOVCAT_DTRACK_API_KEY non configurato."
            exit 1
          fi
          for f in sbom/cyclonedx/bom.cdx.json sbom/cyclonedx/bom-fe.cdx.json; do
            if [ ! -f "$f" ]; then
              echo "ERRORE: SBOM non trovato in $f"
              ls -R sbom/ || true
              exit 1
            fi
            echo "$f: $(wc -c < "$f") byte"
          done

      # Su tag la versione e' il tag ed e' marcata come latest; su main e sui
      # branch di rilascio la versione e' il nome del branch; altrove 'dev'.
      - name: Determina versione Dependency-Track
        id: dtrack
        run: |
          set -euo pipefail
          REF_NAME="${{ github.ref_name }}"
          if [ "${{ github.ref_type }}" = "tag" ]; then
            echo "version=${REF_NAME}" >> "$GITHUB_OUTPUT"
            echo "latest=true" >> "$GITHUB_OUTPUT"
          elif [ "${REF_NAME}" = "main" ] || [[ "${REF_NAME}" == v*.x ]]; then
            echo "version=${REF_NAME}" >> "$GITHUB_OUTPUT"
            echo "latest=false" >> "$GITHUB_OUTPUT"
          else
            echo "version=dev" >> "$GITHUB_OUTPUT"
            echo "latest=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload BE SBOM su Dependency-Track
        env:
          DTRACK_API_KEY: ${{ secrets.GOVCAT_DTRACK_API_KEY }}
          DTRACK_VERSION: ${{ steps.dtrack.outputs.version }}
          DTRACK_LATEST: ${{ steps.dtrack.outputs.latest }}
        run: |
          set -euo pipefail
          ./.github/workflows/scripts/upload-sbom-parent-required.sh \
            "${DTRACK_API_KEY}" \
            "${{ github.workspace }}/sbom/cyclonedx/bom.cdx.json" \
            "GovCat-Backend"

      - name: Upload FE SBOM su Dependency-Track
        env:
          DTRACK_API_KEY: ${{ secrets.GOVCAT_DTRACK_API_KEY }}
          DTRACK_VERSION: ${{ steps.dtrack.outputs.version }}
          DTRACK_LATEST: ${{ steps.dtrack.outputs.latest }}
        run: |
          set -euo pipefail
          ./.github/workflows/scripts/upload-sbom-parent-required.sh \
            "${DTRACK_API_KEY}" \
            "${{ github.workspace }}/sbom/cyclonedx/bom-fe.cdx.json" \
            "GovCat-Frontend"

  release:
    runs-on: ubuntu-latest
    needs: [build_BE, build_FE, osv_scan_BE, osv_scan_FE, sbom]
    if: startsWith(github.ref, 'refs/tags/')

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v6
        with:
          path: artifacts/

      - name: Create pipeline info file
        run: |
          echo "Pipeline Run: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}" > artifacts/${{ github.ref_name }}_actions_run.txt

      - name: Create release ZIP
        run: |
          cd artifacts
          zip -r ../release-reports.zip .

      - name: Create GitHub release
        uses: softprops/action-gh-release@v3
        with:
          files: release-reports.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
