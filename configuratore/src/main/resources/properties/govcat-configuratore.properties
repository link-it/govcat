# ================================================================================
# AUTENTICAZIONE VERSO I SISTEMI ESTERNI: OAUTH CLIENT CREDENTIALS
# ================================================================================
# Terza modalita' di autenticazione verso govway e keycloak, alternativa alla basic auth
# con username e password e all'header statico configurato con '.properties.<header>'.
#
# Il token viene negoziato una sola volta e mantenuto in cache: la rinegoziazione avviene
# solo alla scadenza (per default al 90% di expires_in), non a ogni chiamata e non a ogni
# tick del batch. La cache e' condivisa dalle integrazioni che usano lo stesso token
# endpoint con le stesse credenziali.
#
# Le properties sono opzionali: senza riferimento a un profilo ogni integrazione continua
# ad autenticarsi come prima. Vanno impostate nel file esterno indicato da
# configuratore.ConfigurazioneExecutor.localProperties.
#
# Chiavi di un profilo (il nome del profilo non puo' contenere punti):
#   token-endpoint   obbligatorio, url del token endpoint
#   client-id        obbligatorio
#   client-secret    obbligatorio
#   scope            opzionale
#   audience         opzionale
#   client-auth      opzionale, client_secret_basic (default) o client_secret_post
#   refresh-margin   opzionale, frazione di expires_in per la rinegoziazione (default 0.9)
#   mode             opzionale, oauth_client_credentials (default) o none per disattivare
#                    il profilo e tornare alle credenziali basic dell'integrazione
#
#configuratore.ConfigurazioneExecutor.outbound.auth.govway-collaudo.token-endpoint=https://sso-collaudo.ente.it/auth/realms/govway/protocol/openid-connect/token
#configuratore.ConfigurazioneExecutor.outbound.auth.govway-collaudo.client-id=govcat-batch
#configuratore.ConfigurazioneExecutor.outbound.auth.govway-collaudo.client-secret=
#
# Riferimenti al profilo. Un profilo referenziato ma non configurato manda in errore
# l'inizializzazione del configuratore.
#
# API di configurazione di govway, per ambiente. Indicando il riferimento su un solo ambiente
# si ottiene la modalita' mista: ad esempio collaudo con il token negoziato e produzione con
# le credenziali basic configurate su govwayConfig.produzione.username|password.
#configuratore.ConfigurazioneExecutor.govwayConfig.collaudo.authn.ref=govway-collaudo
#configuratore.ConfigurazioneExecutor.govwayConfig.produzione.authn.ref=govway-produzione
#
# Keycloak, per ambiente: la creazione dei client avviene sull'istanza dell'ambiente
# dell'adesione. Con questa modalita' il login con username e password non viene eseguito.
#configuratore.ConfigurazioneExecutor.keycloak.collaudo.authn.ref=keycloak-collaudo
#configuratore.ConfigurazioneExecutor.keycloak.produzione.authn.ref=keycloak-produzione
