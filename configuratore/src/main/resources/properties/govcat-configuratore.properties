configuratore.ConfigurazioneExecutor.localProperties=${org.govway.api.catalogo.configuratore.resource.path}

# L'API di configurazione di govway e' configurata per ambiente: le adesioni di collaudo
# vengono configurate sull'installazione di collaudo, quelle di produzione su quella di
# produzione. Un ambiente privo di url non viene configurato e le adesioni di quell'ambiente
# terminano con un errore esplicito.
# ATTENZIONE: le precedenti properties prive di ambiente
# (configuratore.ConfigurazioneExecutor.govwayConfig.url|username|password) non sono piu'
# supportate e vanno riscritte nella forma per ambiente.
configuratore.ConfigurazioneExecutor.govwayConfig.collaudo.url=http://127.0.0.1:9080/govwayAPIConfig
configuratore.ConfigurazioneExecutor.govwayConfig.collaudo.username=amministratore
configuratore.ConfigurazioneExecutor.govwayConfig.collaudo.password=123456

configuratore.ConfigurazioneExecutor.govwayConfig.produzione.url=http://127.0.0.1:9080/govwayAPIConfig
configuratore.ConfigurazioneExecutor.govwayConfig.produzione.username=amministratore
configuratore.ConfigurazioneExecutor.govwayConfig.produzione.password=123456

# Keycloak e' configurato per ambiente: i client di collaudo vengono creati sull'istanza di
# collaudo, quelli di produzione sull'istanza di produzione. Un ambiente privo di url non
# viene configurato e le adesioni di quell'ambiente che richiedono keycloak vanno in errore.
configuratore.ConfigurazioneExecutor.keycloak.collaudo.url=http://127.0.0.1:9083/auth
configuratore.ConfigurazioneExecutor.keycloak.collaudo.username=admin
configuratore.ConfigurazioneExecutor.keycloak.collaudo.password=admin
configuratore.ConfigurazioneExecutor.keycloak.collaudo.realm=master

configuratore.ConfigurazioneExecutor.keycloak.produzione.url=http://127.0.0.1:9083/auth
configuratore.ConfigurazioneExecutor.keycloak.produzione.username=admin
configuratore.ConfigurazioneExecutor.keycloak.produzione.password=admin
configuratore.ConfigurazioneExecutor.keycloak.produzione.realm=master

# Autenticazione alternativa a username e password: ogni property con prefisso
# '.properties.' definisce un header aggiunto ad ogni richiesta verso keycloak
# (gli header sovrascrivono l'Authorization ottenuto dal login). Esempi:
#configuratore.ConfigurazioneExecutor.keycloak.collaudo.properties.Authorization=Bearer <token>
#configuratore.ConfigurazioneExecutor.keycloak.produzione.properties.X-API-KEY=<api key>


configuratore.ConfigurazioneScenario.ignoreConflict=true
configuratore.ConfigurazioneScenario.enableKeycloakClientCredentials=true
configuratore.ConfigurazioneScenario.enableGovwayClientCredentials=true
configuratore.ConfigurazioneScenario.enableKeycloakClientCreation=true

