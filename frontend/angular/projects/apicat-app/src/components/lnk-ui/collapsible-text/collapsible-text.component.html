<div class="lnk-collapsible-clip" [id]="_id"
     [class.is-clipped]="_overflow && !_expanded"
     [style.max-height.px]="(_overflow && !_expanded) ? maxHeight : null">
  <div #content><ng-content></ng-content></div>
</div>
@if (_overflow) {
  <button type="button" class="lnk-collapsible-toggle"
          [attr.aria-expanded]="_expanded" [attr.aria-controls]="_id"
          (click)="_toggle()">
    {{ (_expanded ? 'APP.BUTTON.ShowLess' : 'APP.BUTTON.ShowAll') | translate }}
    <i class="bi" [class.bi-chevron-down]="!_expanded" [class.bi-chevron-up]="_expanded" aria-hidden="true"></i>
  </button>
}
