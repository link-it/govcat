<div class="modal-header align-items-center gap-3">
  <div class="flex-grow-1 min-w-0">
    <h5 class="modal-title mb-0" id="rate-limiting-dialog-title">{{ 'APP.SERVICES.RATE_LIMITING.Titolo' | translate }}</h5>
    @if (nomeServizio) { <div class="text-muted small text-truncate">{{ nomeServizio }}</div> }
  </div>
  <lnk-env-toggle [env]="ambiente" [collaudoDisabled]="collaudoDisabled"
                  collaudoDisabledTooltip="APP.MESSAGE.CollaudoNonDisponibileServizio"
                  (change)="onAmbiente($event)"></lnk-env-toggle>
  <button type="button" class="btn-close" [attr.aria-label]="'APP.BUTTON.Close' | translate" (click)="chiudi()"></button>
</div>
<div class="modal-body">
  <app-servizio-rate-limiting-riepilogo
    [idServizio]="idServizio"
    [ambiente]="ambiente"
    [ruoli]="ruoli"
    [mock]="mock">
  </app-servizio-rate-limiting-riepilogo>
</div>
